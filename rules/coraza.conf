# Coraza 基础配置 — 系统特定的规则由 config.json 的 waf_rules 生成
# 部署后建议先用 DetectionOnly 观察，确认无误后改为 On

SecRuleEngine On

SecRequestBodyAccess Off
SecResponseBodyAccess Off

SecAuditEngine Off
SecDebugLogLevel 0

# ----- 空 UA 检测（通用）-----
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:900030,phase:1,deny,status:403,log,auditlog,msg:'Empty UA'"

# ----- 内置攻击检测（SQLi / XSS / RCE）-----
# 命中参数(query string)或路径中的明显攻击特征时拦截
SecRule ARGS "@rx (?i)(\bunion\b[\s\S]{0,40}\bselect\b|\bselect\b.+?\bfrom\b|\bsleep\s*\(|\bbenchmark\s*\(|\bwaitfor\s+delay\b|\bpg_sleep\s*\(|\bif\s*\(.+?,\s*sleep\s*\()" \
    "id:920001,phase:1,deny,status:403,log,auditlog,msg:'SQL Injection'"

SecRule ARGS "@rx (?i)(<\s*script|javascript\s*:|onerror\s*=|onload\s*=|<\s*img[^>]+onerror|alert\s*\(|document\.cookie)" \
    "id:920002,phase:1,deny,status:403,log,auditlog,msg:'XSS'"

SecRule ARGS "@rx (?i)(\b(eval|exec|system|passthru|shell_exec|popen)\s*\(|\bcmd(\.exe)?\b[\s\S]{0,20}\b(/c|/k)\b|\b/bin/(sh|bash)\b|\bwhoami\b|\bnet\s+user\b|\bpowershell\b)" \
    "id:920003,phase:1,deny,status:403,log,auditlog,msg:'RCE'"

# 路径穿越检测
SecRule REQUEST_URI "@rx (\\.\\./|\\.\\.\\\\|%2e%2e%2f|%2e%2e/|%2e%2e%5c)" \
    "id:920004,phase:1,deny,status:403,log,auditlog,msg:'Path Traversal'"

# ----- 以下规则由 config.json waf_rules 动态生成 -----
# scanner_uas   → id:910001
# scanner_paths → id:910002
# cc_paths      → id:910003
# script_ua     → id:910004
# custom_block  → id:910100+
