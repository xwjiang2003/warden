# Coraza 基础配置 — 系统特定的规则由 config.json 的 waf_rules 生成
# 部署后建议先用 DetectionOnly 观察，确认无误后改为 On

SecRuleEngine On

SecRequestBodyAccess Off
SecResponseBodyAccess Off

SecAuditEngine Off
SecDebugLogLevel 0

# ----- 空 UA 检测（通用）-----
SecRule REQUEST_HEADERS:User-Agent "@rx ^$" \
    "id:900030,phase:1,deny,status:403,log,auditlog,msg:'Empty UA'"

# ----- 以下规则由 config.json waf_rules 动态生成 -----
# scanner_uas   → id:910001
# scanner_paths → id:910002
# cc_paths      → id:910003
# script_ua     → id:910004
# custom_block  → id:910100+
